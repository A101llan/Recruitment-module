server {
    listen 5002 default_server;
    listen [::]:5002 default_server;
    server_name _;

    root __APP_ROOT__/HR.Web;
    client_max_body_size 50m;

    # Serve physical static assets directly; fall back to the app for
    # virtual routes (e.g. ASP.NET bundles) that live under these paths.
    location ~ ^/(Content|Scripts|fonts|images)/ {
        try_files $uri @mono;
    }

    location = /favicon.ico { try_files $uri @mono; }

    location / {
        try_files @mono @mono;
    }

    location @mono {
        fastcgi_pass 127.0.0.1:9000;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO "";
        fastcgi_read_timeout 120s;
    }
}
